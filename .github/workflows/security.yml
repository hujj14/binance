name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SAST dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit

      - name: Run Pylint
        run: pylint --fail-under=8.0 . || true

      - name: Run Bandit
        run: bandit -r . -lll -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  # === Job3: Сборка и передача Docker-образа ===
  deploy_test:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-secure-app .
          # Сохраняем образ в файл
          docker save my-secure-app > app-image.tar

      # ВОТ ЗДЕСЬ МЫ СОХРАНЯЕМ АРХИВ
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: app-image.tar
          retention-days: 1

  # === Job4: Скачивание, запуск и DAST ===
  dast:
    runs-on: ubuntu-latest
    needs: deploy_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ВОТ ЗДЕСЬ МЫ СКАЧИВАЕМ АРХИВ
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image and Run
        run: |
          # Загружаем образ из архива
          docker load < app-image.tar
          
          # Запускаем контейнер
          docker run -d --name app-container -p 8080:8080 my-secure-app
          
          # Ждем, пока приложение поднимется
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "Application is up!"
              exit 0
            fi
            sleep 1
          done
          
          echo "APPLICATION FAILED TO START! LOGS BELOW:"
          docker logs app-container
          exit 1

      # Подготовка токена (если вы сделали скрипт)
      - name: Prepare ZAP Auth
        run: |
          chmod +x get_token.sh
          ./get_token.sh

      # Скачиваем спецификацию
      - name: Download OpenAPI Spec
        run: |
          curl -s http://localhost:8080/openapi.json > openapi.json

      # Запускаем ZAP API Scan
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-f openapi -t /zap/wrk/openapi.json -z "-configfile /zap/wrk/zap-auth.prop"'
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          if-no-files-found: warn
