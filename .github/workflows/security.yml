name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Глобальные права, необходимые для загрузки SARIF-отчетов в Security Dashboard
permissions:
  contents: read
  security-events: write
  actions: read

env:
  IMAGE_NAME: finance-backend
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # 1. SAST: Semgrep — поиск небезопасных паттернов в коде
  # ============================================================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_SEND_METRICS: "off"

      # Загружаем отчет только если файл реально создан (защита от пустых прогонов)
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ============================================================
  # 2. SAST: Bandit — специализированный сканер Python
  # ============================================================
  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          # Генерируем SARIF, игнорируя код возврата (|| true), чтобы билд не падал
          bandit -r app/ -f sarif -o bandit.sarif -ll || true
          # Выводим результат в консоль для наглядности
          bandit -r app/ -ll || true

      - name: Upload Bandit SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ============================================================
  # 4. DAST: OWASP ZAP Baseline — динамический скан API
  # ============================================================
  dast-zap:
    name: DAST — OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: [sast-semgrep] # Запускаем DAST только если базовый SAST не упал
    steps:
      - uses: actions/checkout@v4

      - name: Start stack with docker compose
        run: |
          docker compose up -d --build
          # Ждем, пока приложение поднимется и пройдет healthcheck
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "Backend is up and running"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Verify backend is reachable
        run: curl -f http://localhost:8000/health

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          fail_action: false # Пока не валим пайплайн, чтобы избежать ложных срабатываний
          allow_issue_writing: true

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
