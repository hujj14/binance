name: Security Pipeline (SAST + DAST)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job1 + Job2: подготовка зависимостей и SAST
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint bandit

      - name: Run Pylint
        run: pylint --fail-under=8.0 your_package/ || true
        # При необходимости уберите || true, чтобы пайплайн падал при низком качестве

      - name: Run Bandit (SAST)
        run: bandit -r your_package/ -ll
        # -ll означает падение при находках уровня LOW и выше

  # Job3 + Job4: поднятие инфраструктуры и DAST
  dast:
    runs-on: ubuntu-latest
    needs: sast

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start application
        run: |
          python app.py &
          # Ожидание готовности приложения (не более 30 секунд)
          for i in {1..30}; do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "Application failed to start" && exit 1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      - name: ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          # rules_file_name: '.zap/rules.tsv'  # При необходимости укажите правила игнорирования
          allow_issue_writing: false
          fail_action: true  # Падение при обнаружении предупреждений
        # Официальный Action от ZAP автоматически загружает отчёт как artifact

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
