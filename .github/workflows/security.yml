name: Security Pipeline (SAST + DAST)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Глобальные права для всех джоб (необходимы для загрузки SARIF)
permissions:
  contents: read
  security-events: write
  actions: read

env:
  IMAGE_NAME: finance-backend
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # 1. SAST: Semgrep
  # ============================================================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_SEND_METRICS: "off"

      # Гарантируем наличие файла, чтобы следующий шаг не упал
      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > semgrep.sarif
          fi

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ============================================================
  # 2. SAST: Bandit
  # ============================================================
  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit -r app/ -f sarif -o bandit.sarif -ll || true
          bandit -r app/ -ll

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ============================================================
  # 3. SAST: Trivy (исправлен тег)
  # ============================================================
  sast-trivy:
    name: SAST — Trivy (image + fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Исправлено: используем тег v0.32.0 (существует) вместо 0.28.0
      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ============================================================
  # 4. DAST: OWASP ZAP Baseline
  # ============================================================
  dast-zap:
    name: DAST — OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: [sast-semgrep]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack with docker compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done

      - name: Verify backend is reachable
        run: curl -f http://localhost:8000/health

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          fail_action: false
          allow_issue_writing: true

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
