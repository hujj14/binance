name: Security Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SAST dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit

      - name: Run Pylint
        run: pylint --fail-under=8.0 . || true

      - name: Run Bandit
        run: bandit -r . -lll -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  deploy_test:
    runs-on: ubuntu-latest
    needs: sast
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-secure-app .
  dast:
    runs-on: ubuntu-latest
    needs: deploy_test # Обязательно ждем поднятия приложения!
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image (если вы разделяли)
        # (здесь ваш код скачивания и запуска контейнера)
        run: |
          docker images 
          docker run -d --name app-container -p 8080:8080 my-secure-app
          
          # Ждем готовности
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "App is up!"
              break
            fi
            sleep 1
          done

      # 1. Получаем токен и настраиваем ZAP
      - name: Prepare ZAP Auth
        run: |
          chmod +x get_token.sh
          ./get_token.sh

      # 2. Скачиваем openapi.json с работающего приложения
      - name: Download OpenAPI Spec
        run: |
          curl -s http://localhost:8080/openapi.json > openapi.json

      # 3. Запускаем API Scan (вместо Baseline)
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:8080' # Базовый URL
          # Указываем ZAP, где лежит файл спецификации
          cmd_options: '-f openapi -t /zap/wrk/openapi.json -z "-configfile /zap/wrk/zap-auth.prop"'
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
