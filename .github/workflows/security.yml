name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit

      - name: Run Pylint
        run: |
          pylint --fail-under=8.0 your_package/ || true

      - name: Run Bandit
        run: |
          bandit -r . -lll -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: error

  deploy_test:
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Собираем Docker-образ
      - name: Build Docker Image
        run: |
          docker build -t my-secure-app .

      - name: Run Docker Container
        run: |
          # -d (detached) запускает в фоне, -p пробрасывает порт 8080
          docker run -d --name app-container -p 8080:8080 my-secure-app
          
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "Application is up!"
              exit 0
            fi
            sleep 1
          done
          
          echo "========================================="
          echo "APPLICATION FAILED TO START! LOGS BELOW:"
          echo "========================================="
          # Выводим логи контейнера, если приложение не поднялось
          docker logs app-container
          exit 1
          
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          
          allow_issue_writing: false
          
          fail_action: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
