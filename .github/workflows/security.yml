stages:
  - prepare
  - sast
  - deploy
  - dast

# Job1: Подготовка (сохраняем код как артефакт)
prepare:
  stage: prepare
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - echo "Dependencies installed"
  artifacts:
    paths:
      - .  # передаём весь код дальше
    expire_in: 1 hour

# Job2: SAST (pylint + bandit)
sast:
  stage: sast
  image: python:3.11
  needs: [prepare]
  script:
    - pip install pylint bandit
    - pylint --fail-under=8.0 your_package/ || true
    - bandit -r your_package/ -ll
  # bandit с -ll упадёт при находках уровня LOW и выше

# Job3: Поднятие инфраструктуры
deploy_test:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
  # Здесь поднимаете БД (через services) и приложение
  # Сохраняете URL приложения в артефакт или переменную
  script:
    - echo "TARGET_URL=http://your-app:8080" > target.env
  artifacts:
    reports:
      dotenv: target.env

# Job4: DAST
dast:
  stage: dast
  image: docker:latest
  services:
    - docker:dind
  needs: [deploy_test]
  script:
    - source target.env
    - docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
        zap-baseline.py -t $TARGET_URL -r report.html
  artifacts:
    paths:
      - report.html
    when: always
